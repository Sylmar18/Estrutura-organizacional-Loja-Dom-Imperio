>
</head>

  <div class="logo-central">

    <img
      src="assets/img/logo.jpeg"
      alt=""
    >
     </div>

<body>
    

 <div class="layout">

  <aside class="sidebar">

         <div class="logo">

        <img
          src="assets/img/logo.jpeg"
          alt=""
        >

        <div>

          <h2>Dom Império</h2>

          <span>DRY FIT</span>

        </div>

      </div>

      <!-- MENU -->

      <nav class="menu">

        <a href="menu.html">
  <i class="fa-solid fa-chart-line"></i>
  Menu
</a>

<a href="produtos.html">
  <i class="fa-solid fa-box"></i>
  Produtos
</a>

<a href="clientes.html">
  <i class="fa-solid fa-users"></i>
  Clientes
</a>

<a
  href="pedidos.html"
  class="active"
>
  <i class="fa-solid fa-cart-shopping"></i>
  Pedidos
</a>

    <!-- copiar da tela produtos -->
   
</nav>

</aside>

  <main class="content">

    <header class="topbar">

      <div>

        <h1>Pedidos</h1>

        <p>
          Controle de vendas e produção
        </p>

      </div>


</header>

    <section class="pedido-form">

  <h2>Novo Pedido</h2>

  <div class="pedido-grid">

    <input
      type="text"
      id="cliente"
      placeholder="Nome do cliente"
    >

    <select id="produtoPedido">

      <option value="">
        Selecione um produto
      </option>

    </select>

    <input
      type="number"
      id="quantidadePedido"
      placeholder="Quantidade"
      min="1"
    >

    <select id="pagamento">

      <option>Pix</option>

      <option>Dinheiro</option>

      <option>Cartão</option>
     
    </select>
    
    <input type="number"
    id="valorPago"
    placeholder="Valor Pago"
    min="o"
    >

    <input type="date"
    id="dataEntrega"
    >

     
  <section class="cards-pedidos">

    <div class= "card-mini">
      <h3 id="totalPedidos">0</h3>
      <p>Pedidos</p>
    </div>

    <div class= "card-mini">
      <h3 id="faturamento">R$ 0,00</h3>
      <p>faturamento</p>
    </div>

    <div class= "card-mini">
      <h3 id="itensVendidos">0</h3>
      <p>Itens Vendidos</p>
    
    </div>

  </section>
    
    <button onclick="registrarPedido()">
          Registrar Pedido
        </button>


    </div>
    
</section>

   <section class="tabela-container">

  <table>

    <thead>

      <tr>

        <th>Cliente</th>
        <th>Produto</th>
        <th>Quantidade</th>
        <th>Pagamento</th>
        <th>Total</th>
        <th>Valor Pago</th>
        <th>Status</th>
        <th>Data</th>
        <th>Ações</th>

      </tr>

    </thead>

    <tbody id="tabelaPedidos">

    </tbody>

  </table>

</section>

  </main>

  </div>

  
      <script src="assets/js/pedidos.js"></script>

    
</body>
</html>
