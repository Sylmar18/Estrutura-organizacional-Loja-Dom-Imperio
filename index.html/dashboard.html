<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
     <link
    rel="stylesheet"
    href="assets/css/style.css"
  >
 <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  >

</head>

<body>

  <div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">

      <div class="logo">

     <img
    src="assets/img/logo.jpeg"
    alt="Logo Dom Império"
  >

        <h2>Dom Império Dry Fit UA UA UUUA</h2>

      </div>

      <nav class="menu">

        <a href="index.html" class="active">
          <i class="fa-solid fa-chart-line"></i>
          Dashboard
        </a>

        <a href="produtos.html">
          <i class="fa-solid fa-box"></i>
          Produtos
        </a>

        <a href="clientes.html">
          <i class="fa-solid fa-users"></i>
          Clientes
        </a>

      </nav>

    </aside>

    <!-- CONTEÚDO -->
    <main class="content">

      <header class="topbar">

        <h1>Dashboard</h1>

      </header>

      <!-- CARDS -->
      <section class="cards">

        <div class="card-info">

          <i class="fa-solid fa-box"></i>

          <div>

            <h3 id="totalProdutos">0</h3>

            <p>Produtos</p>

          </div>

        </div>

        <div class="card-info">

          <i class="fa-solid fa-users"></i>

          <div>

            <h3 id="totalClientes">0</h3>

            <p>Clientes</p>

          </div>

        </div>

        <div class="card-info">

          <i class="fa-solid fa-money-bill"></i>

          <div>

            <h3 id="valorReceber">
              R$ 0
            </h3>

            <p>Total a Receber</p>

          </div>

        </div>

      </section>

    </main>

  </div>

  <script src="assets/js/db.js"></script>

  <script src="assets/js/dashboard.js"></script>

</body>
</html>
